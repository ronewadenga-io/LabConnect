<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LabConnect Agent — Computer health &amp; fault reporting</title>

    <!-- Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="assets/css/agent.css" />
</head>
<body>

<div class="app-container" id="app">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <h1>Lab<span>Connect</span></h1>
            <div class="tagline">Detect. Report. Resolve.</div>
        </div>

        <nav class="sidebar-nav" id="sidebarNav">
            <!-- filled dynamically -->
        </nav>

        <div class="sidebar-footer">
            <span id="sidebarUser">Guest</span> &middot; <span class="demo-badge">LOCAL</span>
        </div>
    </aside>

    <!-- ===== MAIN ===== -->
    <main class="main-content">
        <!-- Top Bar -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                    <i class="fas fa-bars"></i>
                </button>
                <h2 id="pageTitle">Dashboard</h2>
                <div class="breadcrumb" id="pageBreadcrumb">LabConnect / Dashboard</div>
            </div>
            <div class="topbar-right">
                <span class="role-badge" id="roleBadge">Student</span>
                <div class="user-menu" id="userMenu">
                    <span id="userNameDisplay">Student</span>
                    <div class="avatar" id="userAvatar">S</div>
                </div>
                <button class="btn btn-outline btn-sm" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </header>

        <!-- ===== PAGES ===== -->
        <div id="pages">
            <!-- content rendered by JS -->
        </div>
    </main>
</div>

<!-- Ordered classic scripts keep the prototype usable without a build step. -->
<script defer src="src/config/constants.js"></script>
<script defer src="src/config/storage-keys.js"></script>
<script defer src="src/state/store.js"></script>
<script defer src="src/utils/format.js"></script>
<script defer src="src/services/reports.js"></script>
<script defer src="src/services/storage.js"></script>
<script defer src="src/services/auth.js"></script>
<script defer src="src/components/status-badge.js"></script>
<script defer src="src/components/navigation.js"></script>
<script defer src="src/components/computer-detail.js"></script>
<script defer src="src/pages/dashboard.js"></script>
<script defer src="src/pages/monitoring.js"></script>
<script defer src="src/pages/my-reports.js"></script>
<script defer src="src/pages/auth.js"></script>
<script defer src="src/pages/onboarding.js"></script>
<script defer src="src/pages/labs.js"></script>
<script defer src="src/pages/report.js"></script>
<script defer src="src/pages/faults.js"></script>
<script defer src="src/pages/computers.js"></script>
<script defer src="src/pages/users.js"></script>
<script defer src="src/pages/analytics.js"></script>
<script defer src="src/router.js"></script>
<script defer src="src/app.js"></script>
</body>
</html>
